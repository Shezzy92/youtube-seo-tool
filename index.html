<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const BACKEND_URL = "https://youtube-seo-tool-production.up.railway.app";

// ── STATE ─────────────────────────────────────────────────────────────────────
let lastData = null;

// ── INPUT DETECTION ───────────────────────────────────────────────────────────
const input = document.getElementById('mainInput');
const badge = document.getElementById('modeBadge');

input.addEventListener('input', () => {
  const v = input.value.trim();
  if (/youtube\.com|youtu\.be/.test(v)) {
    badge.textContent = 'URL';
    badge.className = 'mode-badge url';
  } else {
    badge.textContent = 'keyword';
    badge.className = 'mode-badge keyword';
  }
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') analyze();
});

// ── HELPERS ───────────────────────────────────────────────────────────────────
function fmtNum(n) {
  const num = Number(n || 0);
  if (num >= 1e9) return (num / 1e9).toFixed(1) + 'B';
  if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
  if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
  return String(num);
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('en-US', {
    year: 'numeric',
    month: 'short',
    day: 'numeric'
  });
}

function showError(msg) {
  document.getElementById('errorText').textContent = msg;
  document.getElementById('errorMsg').classList.add('show');
}

function hideError() {
  document.getElementById('errorMsg').classList.remove('show');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function setLoader(show, activeStep = 0) {
  const l = document.getElementById('loader');
  l.classList.toggle('show', show);

  for (let i = 1; i <= 4; i++) {
    const el = document.getElementById('step' + i);
    if (!el) continue;
    el.className =
      'loader-step' +
      (i < activeStep ? ' done' : i === activeStep ? ' active' : '');
  }
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = String(s || '');
  return d.innerHTML;
}

function escAttr(s) {
  return String(s || '').replace(/'/g, "\\'");
}

// ── ANALYZE ───────────────────────────────────────────────────────────────────
async function analyze() {
  hideError();

  const query = input.value.trim();
  if (!query) {
    showError('Please enter a YouTube URL or keyword.');
    return;
  }

  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.textContent = 'Analyzing…';

  document.getElementById('results').classList.remove('show');
  setLoader(true, 1);

  try {
    const res = await fetch(`${BACKEND_URL}/api/analyze`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ input: query })
    });

    setLoader(true, 3);

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'Something went wrong.');
    }

    // Normalize backend response
    const videoData = data.videoData || null;
    const originalTags = data.tags?.original || [];
    const viralTagsRaw = data.tags?.viral || [];
    const longTailTags = data.tags?.longTail || [];
    const competitors = data.competitors || [];

    // Backend may return viral as strings; convert to objects for UI consistency
    const viralTags = viralTagsRaw.map(v =>
      typeof v === 'string' ? { tag: v, count: 1 } : v
    );

    // Build competitor tags from competitor titles if backend did not send tags
    const competitorTags = competitors.flatMap(c => c.tags || []).filter(Boolean);

    const allTags = [...originalTags, ...competitorTags];
    const easyRankTags = findEasyRankTags(allTags);
    const seoScore = calcScore(originalTags, viralTags, longTailTags, easyRankTags);

    const copyStr =
      data.copyString ||
      buildCopyString([
        ...viralTags.slice(0, 8).map(v => v.tag),
        ...longTailTags.slice(0, 6),
        ...originalTags.slice(0, 6)
      ], 500);

    lastData = {
      searchQuery: query,
      videoData,
      competitors,
      tags: {
        original: originalTags,
        competitor: [...new Set(competitorTags)].slice(0, 30),
        viral: viralTags,
        longTail: longTailTags,
        easyRank: easyRankTags
      },
      seoScore,
      copyString: copyStr
    };

    setLoader(false, 4);
    renderResults(lastData);

  } catch (err) {
    setLoader(false, 0);
    showError(err.message || 'An error occurred.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Analyze →';
  }
}

// ── TAG ENGINES ───────────────────────────────────────────────────────────────
function buildCopyString(tags, max = 500) {
  let result = '';
  for (const t of tags) {
    const next = result ? `${result}, ${t}` : t;
    if (next.length > max) break;
    result = next;
  }
  return result;
}

function findEasyRankTags(all) {
  const freq = {};
  all.forEach(t => {
    const k = String(t).toLowerCase().trim();
    if (!k) return;
    freq[k] = (freq[k] || 0) + 1;
  });

  return Object.entries(freq)
    .filter(([tag, count]) => count === 1 && tag.split(' ').length >= 3)
    .map(([tag]) => tag)
    .slice(0, 15);
}

function calcScore(orig, viral, lt, easy) {
  let s =
    Math.min((orig || []).length * 2, 30) +
    Math.min((viral || []).length * 1.5, 25) +
    Math.min((lt || []).length, 25) +
    Math.min((easy || []).length * 1.5, 20);

  s = Math.round(Math.min(s, 100));
  return { score: s, label: s >= 70 ? 'High' : s >= 40 ? 'Medium' : 'Low' };
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderResults(d) {
  // Video card
  const vc = document.getElementById('videoCard');
  if (d.videoData) {
    document.getElementById('videoThumb').src = d.videoData.thumbnail || '';
    document.getElementById('videoTitle').textContent = d.videoData.title || 'Untitled Video';
    document.getElementById('videoChannel').textContent =
      '📺 ' + (d.videoData.channelTitle || 'Unknown channel');
    document.getElementById('videoViews').textContent = fmtNum(d.videoData.viewCount || 0);
    document.getElementById('videoDate').textContent = fmtDate(d.videoData.publishedAt);
    document.getElementById('videoTagCount').textContent = d.tags.original.length;
    document.getElementById('videoLikes').textContent = fmtNum(d.videoData.likeCount || 0);
    vc.style.display = 'flex';
  } else {
    vc.style.display = 'none';
  }

  // Tag sections
  renderTagSection('secOriginal', 'tagOriginal', 'cntOriginal', d.tags.original, 'original', t => t);
  renderTagSection('secCompetitor', 'tagCompetitor', 'cntCompetitor', d.tags.competitor, 'competitor', t => t);
  renderTagSection('secViral', 'tagViral', 'cntViral', d.tags.viral, 'viral', v => v.tag, v => `<span class="tag-badge">${v.count}</span>`);
  renderTagSection('secLongTail', 'tagLongTail', 'cntLongTail', d.tags.longTail, 'longtail', t => t);
  renderTagSection('secEasy', 'tagEasy', 'cntEasy', d.tags.easyRank, 'easy', t => t);

  // Competitors
  const cg = document.getElementById('competitorGrid');
  if (d.competitors && d.competitors.length) {
    cg.innerHTML = d.competitors.map(c => `
      <a href="https://youtube.com/watch?v=${c.id}" target="_blank" class="competitor-card">
        <div class="comp-thumb">
          <img src="${escHtml(c.thumbnail || '')}" alt="${escHtml(c.title || 'Competitor video')}" loading="lazy">
        </div>
        <div class="comp-info">
          <div class="comp-title">${escHtml(c.title || 'Untitled')}</div>
          <div class="comp-meta">
            <span class="comp-views">👁 ${fmtNum(c.viewCount || 0)}</span>
            <span>${escHtml(c.channel || 'Unknown channel')}</span>
          </div>
          <div class="comp-tags-preview">
            ${(c.tags || []).slice(0, 4).map(t => `<span class="comp-tag">${escHtml(t)}</span>`).join('')}
          </div>
        </div>
      </a>
    `).join('');
    document.getElementById('secCompetitor').style.display = '';
  } else {
    cg.innerHTML = '';
    document.getElementById('secCompetitor').style.display = d.tags.competitor.length ? '' : 'none';
  }

  // Score
  const sc = d.seoScore;
  const sn = document.getElementById('scoreNum');
  sn.textContent = sc.score;
  sn.className = 'score-number ' + sc.label.toLowerCase();

  const sp = document.getElementById('scorePill');
  sp.textContent = sc.label;
  sp.className = 'score-pill ' + sc.label.toLowerCase();

  document.getElementById('secScore').style.display = '';

  const setBar = (id, vId, val, max) => {
    setTimeout(() => {
      document.getElementById(id).style.width =
        Math.min((val / max) * 100, 100) + '%';
      document.getElementById(vId).textContent = val;
    }, 200);
  };

  setBar('bar1', 'barVal1', d.tags.original.length, 30);
  setBar('bar2', 'barVal2', d.tags.viral.length, 20);
  setBar('bar3', 'barVal3', d.tags.longTail.length, 25);
  setBar('bar4', 'barVal4', d.tags.easyRank.length, 15);

  // Copy box
  document.getElementById('copyBox').textContent = d.copyString;

  // Generators
  document.getElementById('secGenerators').style.display = '';
  document.getElementById('titleOutput').classList.remove('show');
  document.getElementById('descOutput').classList.remove('show');

  // Show results
  document.getElementById('results').classList.add('show');
  setTimeout(() => {
    document.getElementById('results').scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });
  }, 100);
}

function renderTagSection(secId, cloudId, cntId, items, cls, getLabel, getSuffix) {
  const sec = document.getElementById(secId);
  const cloud = document.getElementById(cloudId);
  const cnt = document.getElementById(cntId);

  if (!items || !items.length) {
    sec.style.display = 'none';
    return;
  }

  sec.style.display = '';
  cnt.textContent = items.length;

  cloud.innerHTML = items.map(item => {
    const label = getLabel(item);
    const suffix = getSuffix ? getSuffix(item) : '';
    return `<span class="tag ${cls}" onclick="copyTag('${escAttr(label)}')" title="Click to copy">${escHtml(label)}${suffix}</span>`;
  }).join('');

  cloud.querySelectorAll('.tag').forEach((el, i) => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    setTimeout(() => {
      el.style.transition = 'all 0.2s ease';
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    }, i * 18);
  });
}

// ── COPY / DOWNLOAD ───────────────────────────────────────────────────────────
function copyTag(tag) {
  navigator.clipboard?.writeText(tag)
    .then(() => showToast(`Copied: ${tag}`))
    .catch(() => {});
}

function copyTags() {
  const text = document.getElementById('copyBox').textContent;
  navigator.clipboard?.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.classList.add('copied');
    btn.textContent = '✓ Copied!';
    showToast('All tags copied to clipboard!');
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.textContent = '📋 Copy All Tags';
    }, 2000);
  }).catch(() => showToast('Copy failed – please copy manually.'));
}

function downloadTags() {
  if (!lastData) return;

  const parts = [
    '=== STEPTOOL – YouTube SEO Tags Export ===',
    `Query: ${lastData.searchQuery}`,
    `Date: ${new Date().toLocaleDateString()}`,
    '',
    '--- COPY STRING (500 chars) ---',
    lastData.copyString,
    '',
    '--- ORIGINAL TAGS ---',
    lastData.tags.original.join(', '),
    '',
    '--- VIRAL TAGS ---',
    lastData.tags.viral.map(v => `${v.tag} (${v.count}x)`).join(', '),
    '',
    '--- LONG-TAIL TAGS ---',
    lastData.tags.longTail.join('\n'),
    '',
    '--- EASY RANK TAGS ---',
    lastData.tags.easyRank.join('\n')
  ];

  const blob = new Blob([parts.join('\n')], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'steptool-tags.txt';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('Downloaded steptool-tags.txt');
}

// ── BONUS GENERATORS ──────────────────────────────────────────────────────────
function generateTitles() {
  if (!lastData) return;

  const tags = lastData.tags.viral.slice(0, 5).map(v => v.tag);
  const title = lastData.videoData?.title || lastData.searchQuery;
  const yr = new Date().getFullYear();

  const suggestions = [
    `How to ${tags[0] || title} – Complete Tutorial ${yr}`,
    `${title} | Step-by-Step Beginner's Guide`,
    `${yr} Best ${tags[1] || title} Strategy That Actually Works`,
    `Ultimate ${tags[0] || title} Guide – Watch Before Everyone Else Does`,
    `${title} Explained in Under 10 Minutes (${yr} Update)`
  ];

  const out = document.getElementById('titleOutput');
  out.innerHTML = suggestions.map((s, i) =>
    `<div class="gen-item" onclick="copyTag('${escAttr(s)}')" title="Click to copy">${i + 1}. ${escHtml(s)}</div>`
  ).join('');
  out.classList.add('show');
  showToast('Title suggestions generated!');
}

function generateDescription() {
  if (!lastData) return;

  const tags = [
    ...lastData.tags.original,
    ...lastData.tags.viral.map(v => v.tag)
  ].slice(0, 8);

  const title = lastData.videoData?.title || lastData.searchQuery;

  const desc =
`In this video, we break down everything you need to know about ${title}.

📌 What you'll learn:
${tags.slice(0, 5).map(t => `• ${t}`).join('\n')}

💡 Whether you're a beginner or looking to level up, this guide covers it all.

🔔 Subscribe for more YouTube SEO tips and video marketing strategies!

🔗 Useful Links:
• [Add your website here]
• [Add related video here]

Tags: ${tags.join(', ')}

${tags.slice(0, 5).map(t => `#${t.replace(/\s+/g, '')}`).join(' ')}`;

  const out = document.getElementById('descOutput');
  out.innerHTML = `
    <div style="white-space:pre-wrap;font-size:13px;color:var(--text2);line-height:1.7">${escHtml(desc)}</div>
    <div style="margin-top:10px">
      <button class="btn btn-ghost" style="font-size:12px" onclick="copyTag('${escAttr(desc)}')">📋 Copy Description</button>
    </div>
  `;
  out.classList.add('show');
  showToast('Description generated!');
}

// ── FAQ ───────────────────────────────────────────────────────────────────────
function toggleFaq(el) {
  el.parentElement.classList.toggle('open');
}
</script>
